name: Browser website tests
on:
  push:
  pull_request:
jobs:
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser password policy
        run: node web-tests/policy.test.cjs
      - name: Check JavaScript syntax
        run: |
          node --check docs/policy.js
          node --check docs/app.js
