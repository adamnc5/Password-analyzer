name: Java checks
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile
        run: |
          mkdir -p out
          javac -encoding UTF-8 -Xlint:all -d out src/passwordcheck/*.java test/passwordcheck/*.java
      - name: Test
        run: java -cp out passwordcheck.PasswordAnalyzerTest
